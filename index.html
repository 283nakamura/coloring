function makeNamedSticker(shot,name){
 const nameText=name||'なまえなし号';const source=shot.canvas;
 const c=document.createElement('canvas');c.width=source.width;c.height=source.height;
 const g=c.getContext('2d');g.drawImage(source,0,0);
 // 後主翼上部の内側へ固定配置。白地を設け、カットラインには触れない。
 const w=c.width,h=c.height;
 const labelW=w*.55,labelH=Math.min(h*.09,w*.075);
 const x=(w-labelW)/2,y=h*.105;
 g.fillStyle='rgba(255,255,255,0.95)';g.beginPath();g.roundRect(x,y,labelW,labelH,labelH*.3);g.fill();
 let font=Math.round(labelH*.62);g.textAlign='center';g.textBaseline='middle';
 do{g.font='900 '+font+'px system-ui,sans-serif';if(g.measureText(nameText).width<=labelW*.9)break;font-=2;}while(font>12);
 g.fillStyle='#153b73';g.fillText(nameText,w/2,y+labelH/2);
 const scale=Math.min(1,44/shot.heightMM,72/shot.widthMM);
 return {url:c.toDataURL('image/png'),widthMM:shot.widthMM*scale,heightMM:shot.heightMM*scale,name:nameText};
}

 // 3D表示中の機体を現在の斜め上視点から画像化（印刷画像には影響しない）。
 function snapshotFinishedAircraft(){
   if(!model)return null;
   resetView();
   const sceneEl=$('a-scene'), renderer=sceneEl.renderer;
   const cam=$('#camera').getObject3D('camera');
   if(!renderer||!cam)return null;
   const w=960,h=580;
   const target=new THREE.WebGLRenderTarget(w,h,{depthBuffer:true});
   const oldTarget=renderer.getRenderTarget(),oldRatio=renderer.getPixelRatio();
   const oldBg=sceneEl.object3D.background;
   const oldViewport=new THREE.Vector4(),oldScissor=new THREE.Vector4();
   renderer.getViewport(oldViewport);renderer.getScissor(oldScissor);
   const oldScissorTest=renderer.getScissorTest();
   const pixels=new Uint8Array(w*h*4);
   const oldAspect=cam.aspect;
   try{
     renderer.setPixelRatio(1);
     sceneEl.object3D.background=new THREE.Color('#e7f4ff');
     cam.aspect=w/h;cam.updateProjectionMatrix();
     renderer.setRenderTarget(target);renderer.setViewport(0,0,w,h);renderer.setScissorTest(false);
     renderer.render(sceneEl.object3D,cam);
     renderer.readRenderTargetPixels(target,0,0,w,h,pixels);
     const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
     const ctx=canvas.getContext('2d'),image=ctx.createImageData(w,h);
     for(let y=0;y<h;y++)image.data.set(pixels.subarray((h-y-1)*w*4,(h-y)*w*4),y*w*4);
     ctx.putImageData(image,0,0);
     return canvas.toDataURL('image/png');
   }finally{
     renderer.setRenderTarget(oldTarget);renderer.setPixelRatio(oldRatio);
     renderer.setViewport(oldViewport);renderer.setScissor(oldScissor);renderer.setScissorTest(oldScissorTest);
     sceneEl.object3D.background=oldBg;cam.aspect=oldAspect;cam.updateProjectionMatrix();
     target.dispose();
   }
 }
