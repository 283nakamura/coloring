/* iPad横向き：左に3D、右に塗り絵。縦向きは従来の上下配置。 */
@media (orientation: landscape) and (min-width: 700px) {
  main { flex-direction: row; height: calc(100dvh - 44px); min-height: 0; overflow: hidden; }
  .viewer { flex: 0 0 60%; min-width: 0; min-height: 0; height: 100%; }

           overflow-y: auto; overscroll-behavior: contain;

  .drawing { flex: 0 0 auto; height: min(46dvh, 330px);

  .tools { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-items:stretch; }

  .print-tools { margin-top: 0; }
  .hint { margin-top: 2px; }
}

/* 運営操作は体験者向けの描画操作から離し、初期状態では非表示 */
.staff-zone{margin-top:auto;padding:12px 0 3px;border-top:2px solid #d5deea;}
.staff-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.staff-label{font-size:11px;color:#718096;font-weight:700;}
#staffUnlock{border:1px dashed #9baabd;background:#f3f6fa;color:#526276;border-radius:8px;padding:9px 11px;font-size:12px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;}
#staffControls[hidden],#staffUnlock[hidden],#staffLock[hidden]{display:none!important;}
#staffControls{padding-top:10px;justify-content:flex-start;}

}
