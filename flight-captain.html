<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フライトキャプテン体験</title><style>body{font-family:system-ui;background:#eaf4ff;color:#184c73;margin:0;text-align:center}main{max-width:680px;margin:9vh auto;padding:25px;background:white;border-radius:20px}button,a{display:inline-block;background:#ffad44;border:0;border-radius:12px;padding:15px 23px;font-size:19px;font-weight:bold;color:#243b55;text-decoration:none}p{line-height:1.7}</style><main><h1>ジオラマの方に移動しよう！</h1><p id="message">機体のデザインを確認しています…</p><p id="name"></p><a id="start" href="./AirTaxi_Offline.html" style="display:none">フライト体験スタート！</a><p style="font-size:13px;color:#6a7480">現在の試作版では、既存のフライトキャプテン体験が開きます。機体選択の省略と塗り絵3D機体の離陸シーンへの反映は未実装です。</p></main><script>const r=indexedDB.open('aircraft-ar-design',1);r.onsuccess=()=>{const db=r.result,tx=db.transaction('designs','readonly');const q=tx.objectStore('designs').get('latest');q.onsuccess=()=>{if(q.result){document.querySelector('#message').textContent='デザインを確認しました。';document.querySelector('#name').textContent=q.result.name?'機体名：'+q.result.name:'';document.querySelector('#start').style.display='inline-block';}else document.querySelector('#message').textContent='デザインがありません。塗り絵画面に戻ってください。';db.close();};};r.onerror=()=>document.querySelector('#message').textContent='保存データを読み込めませんでした。';</script></html>
