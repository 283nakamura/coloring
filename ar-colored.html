<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>空飛ぶクルマ AR体験</title><script type="module" src="./vendor/model-viewer.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#eaf2fb;color:#19384f}model-viewer{width:100%;height:100dvh;display:block}#panel{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:#fffffff0;padding:12px;border-radius:14px;box-shadow:0 2px 12px #0002;display:grid;gap:8px;max-width:720px;margin:auto}h1{font-size:18px;margin:0}label{font-size:14px;font-weight:bold}select{padding:10px;font-size:17px;border-radius:8px;border:1px solid #aac;width:100%}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:10px;padding:12px;background:#f9a03d;font-size:17px;font-weight:800;color:#302100}button:disabled{opacity:.45}#next{background:#2777ac;color:white}#status{font-size:13px;line-height:1.4}#bottom{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;gap:8px;justify-content:center}#bottom button{max-width:300px;flex:1}#next[hidden]{display:none}#launch[hidden]{display:none}
</style></head><body><model-viewer id="mv" camera-controls camera-orbit="25deg 82deg 75m" field-of-view="35deg" ar ar-modes="quick-look" ar-placement="floor" ar-scale="fixed" shadow-intensity="1"></model-viewer><div id="panel"><h1>AR左右位置テスト（向き180°・倍率3倍）</h1><label for="offset">機体の横方向オフセット</label><select id="offset"><option value="center">中央（0m）</option><option value="left6">左へ6m</option><option value="left12">左へ12m</option><option value="right6">右へ6m</option><option value="right12">右へ12m</option></select><div id="status">塗り絵した機体を準備中…</div><small>同じ位置・同じ向きでiPadを構え、左右の設定を比較してください。モデルの位置をずらす試験であり、Quick Lookの初期配置を保証するものではありません。</small><small>機体の向き：180° ／ 大きさ：3倍（前回OKの設定を維持）</small></div><div id="bottom"><button id="launch" disabled>目の前に機体を出そう！</button><button id="next" hidden>次へ ▶</button></div><script>
const offset=document.querySelector('#offset');const mv=document.querySelector('#mv'),status=document.querySelector('#status'),launch=document.querySelector('#launch'),next=document.querySelector('#next');
let design=null,ready=false,attempted=false,left=false;
function readARDesign(){return new Promise((resolve,reject)=>{const r=indexedDB.open('aircraft-ar-design',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('designs'))r.result.createObjectStore('designs')};r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('designs','readonly'),g=tx.objectStore('designs').get('latest');g.onsuccess=()=>{resolve(g.result);db.close()};g.onerror=()=>{reject(g.error);db.close()}}})}
async function setup(){status.textContent='モデルと塗り絵を読み込み中…';try{await customElements.whenDefined('model-viewer');try{design=await readARDesign()}catch(e){console.warn('Design not available',e)}mv.src='./models/aircraft_ar_lateral_'+offset.value+'.glb';await new Promise((resolve,reject)=>{const ok=()=>{cleanup();resolve()},bad=()=>{cleanup();reject(Error('モデル読み込み失敗'))},cleanup=()=>{mv.removeEventListener('load',ok);mv.removeEventListener('error',bad)};mv.addEventListener('load',ok);mv.addEventListener('error',bad)});if(design){for(const [part,name] of [['top','M_Paint_Top'],['side','M_Paint_Side']]){if(!design[part])continue;const texture=await mv.createTexture(design[part]);for(const mat of mv.model.materials.filter(m=>m.name===name)){mat.pbrMetallicRoughness.setBaseColorFactor([1,1,1,1]);mat.pbrMetallicRoughness.baseColorTexture.setTexture(texture)}}}ready=true;launch.disabled=false;status.textContent=design?'準備完了！選んだ横方向設定でARを起動しよう。':'準備完了（塗り絵データなし）。ARを起動しよう。'}catch(e){status.textContent='エラー：'+e.message}}
offset.onchange=()=>{ready=false;launch.disabled=true;setup()};launch.onclick=async()=>{if(!ready)return;attempted=true;left=false;next.hidden=true;status.textContent='AR起動中…';try{await mv.activateAR()}catch(e){status.textContent='ARを開けませんでした。もう一度お試しください。'}};
function returned(){if(attempted&&left){next.hidden=false;status.textContent='AR体験はどうだったかな？次はタブレットを持ったまま、ジオラマのところまで進んだら「次へ」を押そう！'}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&attempted)left=true;else if(!document.hidden)returned()});window.addEventListener('focus',returned);window.addEventListener('pageshow',returned);mv.addEventListener('ar-status',e=>{if(e.detail.status==='session-started')left=true;if(e.detail.status==='not-presenting'&&attempted){left=true;returned()}});next.onclick=()=>location.href='./AirTaxi_Offline.html';
setup();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script></body></html>
