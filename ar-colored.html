<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自分の空飛ぶクルマ AR</title><script type="module" src="./vendor/model-viewer.min.js"></script><style>body{margin:0;font-family:system-ui,sans-serif;background:#fff8ed;color:#27445e}header{background:#ffbd59;text-align:center;padding:16px;font-size:23px;font-weight:900}model-viewer{display:block;width:100%;height:67dvh;background:#eaf2fb}.ar-button,.back{border:0;border-radius:14px;padding:15px 24px;background:#ff922b;color:#fff;font-size:19px;font-weight:900}.back{background:#2579aa;text-decoration:none;display:inline-block;font-size:15px}.controls{text-align:center;padding:14px}#status{font-size:15px;margin:10px}</style></head><body><header>きみの空飛ぶクルマをARで！</header><model-viewer id="mv" src="./models/aircraft_ar_meters.glb" camera-controls auto-rotate ar ar-modes="quick-look" ar-scale="fixed" ar-placement="floor" shadow-intensity="1"><button slot="ar-button" class="ar-button">📱 ARで見てみよう！</button></model-viewer><div class="controls"><div id="status">デザインを読み込み中…</div><a class="back" href="./index.html">← デザイン画面にもどる</a></div><script>
function readARDesign(){return new Promise((resolve,reject)=>{const r=indexedDB.open('aircraft-ar-design',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('designs'))r.result.createObjectStore('designs');};r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('designs','readonly'),get=tx.objectStore('designs').get('latest');get.onsuccess=()=>{resolve(get.result);db.close();};get.onerror=()=>{reject(get.error);db.close();};};});}
const mv=document.querySelector('#mv'),status=document.querySelector('#status');
(async()=>{try{
 const design=await readARDesign();if(!design){status.textContent='保存されたデザインがありません。塗り絵の完成画面から開いてください。';return;}
 await customElements.whenDefined('model-viewer');await mv.updateComplete;
 if(!mv.model){await new Promise((resolve,reject)=>{mv.addEventListener('load',resolve,{once:true});mv.addEventListener('error',reject,{once:true});});}
 const materials=mv.model.materials;
 for(const [part,name] of [['top','M_Paint_Top'],['side','M_Paint_Side']]){
   const texture=await mv.createTexture(design[part]);
   const matches=materials.filter(m=>m.name===name);
   if(!matches.length)throw Error('マテリアルがありません: '+name);
   for(const material of matches){material.pbrMetallicRoughness.setBaseColorFactor([1,1,1,1]);material.pbrMetallicRoughness.baseColorTexture.setTexture(texture);}
 }
 status.textContent=(design.name?'「'+design.name+'」 ':'')+'準備完了！ ARボタンを押そう！ 目の前の床を映して配置してね。';
 }catch(e){console.error(e);status.textContent='着色の反映に失敗しました: '+(e.message||e);}})();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script></body></html>
