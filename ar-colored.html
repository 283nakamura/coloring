<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AR 向き・倍率テスト</title><script type="module" src="./vendor/model-viewer.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#eaf2fb;color:#19384f}model-viewer{width:100%;height:100dvh;display:block}#panel{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:#fffffff0;padding:12px;border-radius:14px;box-shadow:0 2px 12px #0002;display:grid;gap:8px;max-width:720px;margin:auto}h1{font-size:18px;margin:0}label{font-size:14px;font-weight:bold}select{padding:10px;font-size:17px;border-radius:8px;border:1px solid #aac;width:100%}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:10px;padding:12px;background:#f9a03d;font-size:17px;font-weight:800;color:#302100}button:disabled{opacity:.45}#next{background:#2777ac;color:white}#status{font-size:13px;line-height:1.4}#bottom{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;gap:8px;justify-content:center}#bottom button{max-width:300px;flex:1}#next[hidden]{display:none}#launch[hidden]{display:none}
</style></head><body><model-viewer id="mv" camera-controls camera-orbit="35deg 83deg 22m" field-of-view="35deg" ar ar-modes="quick-look" ar-placement="floor" ar-scale="fixed" shadow-intensity="1"></model-viewer><div id="panel"><h1>AR向き・倍率テスト</h1><div class="controls"><div><label for="angle">機体の向き</label><select id="angle"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></div><div><label for="size">倍率（10m基準）</label><select id="size"><option value="1">1.0倍（約10m）</option><option value="1p5">1.5倍（約15m）</option><option value="2">2.0倍（約20m）</option></select></div></div><div id="status">モデルを読み込み中…</div><small>設定を選ぶと3Dモデルを切り替えます。ARを閉じたら別の設定を試せます。</small></div><div id="bottom"><button id="launch" disabled>この設定でARを見る</button><button id="next" hidden>次へ ▶</button></div><script>
const mv=document.querySelector('#mv'),angle=document.querySelector('#angle'),size=document.querySelector('#size'),status=document.querySelector('#status'),launch=document.querySelector('#launch'),next=document.querySelector('#next');let design=null,version=0,ready=false,attempted=false,left=false;
function readARDesign(){return new Promise((resolve,reject)=>{const r=indexedDB.open('aircraft-ar-design',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('designs'))r.result.createObjectStore('designs')};r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('designs','readonly'),g=tx.objectStore('designs').get('latest');g.onsuccess=()=>{resolve(g.result);db.close()};g.onerror=()=>{reject(g.error);db.close()}}})}
async function update(){const id=++version;ready=false;launch.disabled=true;next.hidden=true;status.textContent='モデルと塗り絵を読み込み中…';const src='./models/aircraft_ar_test_'+angle.value+'_'+size.value+'.glb';mv.src=src;try{await new Promise((resolve,reject)=>{if(mv.model&&mv.getAttribute('src')===src&&mv.loaded)return resolve();const ok=()=>{cleanup();resolve()},bad=()=>{cleanup();reject(Error('モデル読み込み失敗'))},cleanup=()=>{mv.removeEventListener('load',ok);mv.removeEventListener('error',bad)};mv.addEventListener('load',ok);mv.addEventListener('error',bad)});if(id!==version)return;if(design){for(const [part,name] of [['top','M_Paint_Top'],['side','M_Paint_Side']]){if(!design[part])continue;const texture=await mv.createTexture(design[part]);if(id!==version)return;for(const mat of mv.model.materials.filter(m=>m.name===name)){mat.pbrMetallicRoughness.setBaseColorFactor([1,1,1,1]);mat.pbrMetallicRoughness.baseColorTexture.setTexture(texture)}}}if(id!==version)return;ready=true;launch.disabled=false;status.textContent='準備完了：'+angle.value+'°／'+size.options[size.selectedIndex].text+'。ARで確認してください。'}catch(e){if(id===version)status.textContent='エラー：'+e.message}}
angle.onchange=update;size.onchange=update;launch.onclick=async()=>{if(!ready)return;attempted=true;left=false;status.textContent='AR起動中…';try{await mv.activateAR()}catch(e){status.textContent='ARを開けませんでした。もう一度ボタンを押してください。'}};
function returned(){if(attempted&&left){next.hidden=false;status.textContent='AR体験はどうだったかな？次はタブレットを持ったまま、ジオラマのところまで進んだら「次へ」を押そう！'}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&attempted)left=true;else if(!document.hidden)returned()});window.addEventListener('focus',returned);window.addEventListener('pageshow',returned);mv.addEventListener('ar-status',e=>{if(e.detail.status==='session-started')left=true;if(e.detail.status==='not-presenting'&&attempted){left=true;returned()}});next.onclick=()=>location.href='./AirTaxi_Offline.html';
(async()=>{try{design=await readARDesign();if(!design)status.textContent='塗り絵データがありません。無着色のモデルで確認します。';await customElements.whenDefined('model-viewer');await update()}catch(e){status.textContent='初期化エラー：'+e.message;await update()}})();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script></body></html>
