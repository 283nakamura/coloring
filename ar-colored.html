<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>空飛ぶクルマ AR</title><script type="module" src="./vendor/model-viewer.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#eaf2fb;color:#27445e}model-viewer{width:100%;height:100dvh;display:block}#hud{position:fixed;inset:auto 0 max(22px,env(safe-area-inset-bottom)) 0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;pointer-events:none}#hud>*{pointer-events:auto}#status{background:#ffffffed;border-radius:12px;padding:12px 18px;font-size:clamp(15px,2vw,20px);font-weight:750;line-height:1.5;text-align:center;max-width:min(92vw,780px)}button{border:0;border-radius:14px;padding:15px 25px;background:#ff9e30;color:#402400;font-size:20px;font-weight:900;box-shadow:0 3px 12px #0002}#next{background:#2579aa;color:#fff}#launch[hidden],#next[hidden]{display:none!important}
</style></head><body><model-viewer id="mv" src="./models/aircraft_ar_meters.glb#callToAction=%E6%AC%A1%E3%81%B8%20%E2%96%B6&amp;checkoutTitle=%E8%87%AA%E5%88%86%E3%81%AE%E7%A9%BA%E9%A3%9B%E3%81%B6%E3%82%AF%E3%83%AB%E3%83%9E" scale="8.5 8.5 8.5" camera-orbit="35deg 88deg auto" camera-target="auto auto auto" field-of-view="35deg" camera-controls ar ar-modes="quick-look" ar-scale="fixed" ar-placement="floor" shadow-intensity="1"></model-viewer><div id="hud"><div id="status">ARを準備しています…</div><button id="launch" hidden>目の前に機体を出そう！</button><button id="next" hidden>次へ ▶</button></div><script>
function readARDesign(){return new Promise((resolve,reject)=>{const r=indexedDB.open('aircraft-ar-design',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('designs'))r.result.createObjectStore('designs')};r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('designs','readonly'),get=tx.objectStore('designs').get('latest');get.onsuccess=()=>{resolve(get.result);db.close()};get.onerror=()=>{reject(get.error);db.close()}}})}
const mv=document.querySelector('#mv'),status=document.querySelector('#status'),launch=document.querySelector('#launch'),next=document.querySelector('#next');let ready=false,arStarted=false,arAttempted=false;let arLeftPage=false;
next.onclick=()=>location.href='./AirTaxi_Offline.html';
// Quick Look custom action is emitted by model-viewer from its internal AR anchor.
// Preserve the intermediate guidance screen instead of skipping directly to flight.
mv.addEventListener('quick-look-button-tapped',()=>{arStarted=true;arLeftPage=true;showNext();});
function showNext(){if(!ready)return;next.hidden=false;launch.hidden=true;status.textContent='AR体験はどうだったかな？次はタブレットを持ったまま、ジオラマのところまで進んだら「次へ」を押そう！'}
function tryAR(){if(!ready)return;arAttempted=true;try{const result=mv.activateAR();Promise.resolve(result).catch(e=>{console.warn('AR start:',e);launch.hidden=false;status.textContent='ボタンを押してARを始めよう！'})}catch(e){console.warn(e);launch.hidden=false;status.textContent='ボタンを押してARを始めよう！'}}
launch.onclick=tryAR;
mv.addEventListener('ar-status',e=>{if(e.detail.status==='session-started'){arStarted=true;arLeftPage=true;launch.hidden=true}if(e.detail.status==='not-presenting'&&arStarted)showNext()});
// iOS Quick Look returns control to Safari/PWA after user closes the AR viewer.
window.addEventListener('pageshow',()=>{if(arLeftPage&&ready)showNext()});window.addEventListener('focus',()=>{if(arLeftPage&&ready)showNext()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&arAttempted)arLeftPage=true;else if(!document.hidden&&arLeftPage&&ready)showNext()});
(async()=>{try{const design=await readARDesign();if(!design)throw Error('塗り絵データが見つかりません');await customElements.whenDefined('model-viewer');await mv.updateComplete;if(!mv.model)await new Promise((resolve,reject)=>{mv.addEventListener('load',resolve,{once:true});mv.addEventListener('error',reject,{once:true})});for(const [part,name] of [['top','M_Paint_Top'],['side','M_Paint_Side']]){const texture=await mv.createTexture(design[part]);const mats=mv.model.materials.filter(m=>m.name===name);if(!mats.length)throw Error('マテリアルがありません: '+name);for(const mat of mats){mat.pbrMetallicRoughness.setBaseColorFactor([1,1,1,1]);mat.pbrMetallicRoughness.baseColorTexture.setTexture(texture)}}ready=true;status.textContent='ARを起動しています…';// Browser may reject programmatic Quick Look due to required user gesture.
tryAR();setTimeout(()=>{if(!arStarted&&!document.hidden){launch.hidden=false;status.textContent='ボタンを押してARを始めよう！'}},1400);
}catch(e){console.error(e);status.textContent='ARの準備に失敗しました: '+(e.message||e);launch.hidden=true}})();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script></body></html>
