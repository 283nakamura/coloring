<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>自分の空飛ぶクルマを飛ばそう！</title><script type="module" src="./vendor/model-viewer.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:#fff8ed;color:#27445e;display:flex;flex-direction:column}header{flex:0 0 auto;background:#ffbd59;text-align:center;padding:12px 8px;font-size:clamp(19px,3vw,27px);font-weight:900}model-viewer{display:block;width:100%;height:38dvh;min-height:0;flex:1 1 auto;background:#eaf2fb}.controls{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:11px;padding:13px 12px max(16px,env(safe-area-inset-bottom));text-align:center}.message{font-size:clamp(19px,3vw,25px);font-weight:900;margin:0}.start{display:inline-block;text-decoration:none;border-radius:14px;padding:14px 26px;background:#2579aa;color:white;font-size:clamp(18px,2.5vw,22px);font-weight:900}.status{font-size:12px;color:#567;min-height:1em}@media(max-height:650px){header{padding:7px}.controls{padding:7px 10px 10px;gap:7px}.start{padding:10px 20px}}
</style></head><body><header>自分の空飛ぶクルマを飛ばそう！</header><model-viewer id="mv" src="./models/aircraft_ar_meters.glb" camera-controls auto-rotate shadow-intensity="1" camera-orbit="35deg 70deg auto"></model-viewer><div class="controls"><p class="message">ジオラマの方に移動しよう！</p><a class="start" href="./flight-captain.html">フライト体験スタート！</a><div id="status" class="status">機体を読み込み中…</div></div><script>
function readDesign(){return new Promise((resolve,reject)=>{const r=indexedDB.open('aircraft-ar-design',1);r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('designs','readonly'),get=tx.objectStore('designs').get('latest');get.onsuccess=()=>{resolve(get.result);db.close()};get.onerror=()=>{reject(get.error);db.close()}}})}
(async()=>{const mv=document.querySelector('#mv'),status=document.querySelector('#status');try{const design=await readDesign();if(!design)throw Error('保存データがありません');await customElements.whenDefined('model-viewer');await mv.updateComplete;if(!mv.model)await new Promise((resolve,reject)=>{mv.addEventListener('load',resolve,{once:true});mv.addEventListener('error',reject,{once:true})});for(const [part,name] of [['top','M_Paint_Top'],['side','M_Paint_Side']]){const tex=await mv.createTexture(design[part]);const mats=mv.model.materials.filter(m=>m.name===name);if(!mats.length)throw Error(name+' が見つかりません');for(const m of mats){m.pbrMetallicRoughness.setBaseColorFactor([1,1,1,1]);m.pbrMetallicRoughness.baseColorTexture.setTexture(tex)}}status.textContent=design.name?'「'+design.name+'」で出発しよう！':''}catch(e){status.textContent='機体の表示に失敗しました: '+(e.message||e)}})();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script></body></html>
