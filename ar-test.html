
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>空飛ぶクルマ ARテスト</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #fff8ed;
    }

    header {
      padding: 20px;
      background: #ffbd59;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    model-viewer {
      width: 100%;
      height: 65vh;
      background: #eef7ff;
    }

    .note {
      padding: 18px;
      text-align: center;
      font-size: 17px;
    }

    .ar-button {
      padding: 16px 26px;
      background: #ff922b;
      color: white;
      border: 0;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>空飛ぶクルマ ARテスト</header>

  <model-viewer
    src="./models/aircraft_coloring.glb"
    alt="空飛ぶクルマ"
    camera-controls
    auto-rotate
    ar
    ar-modes="quick-look"
    ar-scale="auto"
    ar-placement="floor"
    shadow-intensity="1">

    <button slot="ar-button" class="ar-button">
      ARで見てみよう！
    </button>

  </model-viewer>

  <div class="note">
    ボタンを押して、机や床に機体を置いてみよう！
  </div>
</body>
</html>
