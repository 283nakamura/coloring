<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AirTaxi 動画テスト2</title><style>body{font:16px system-ui;background:#142334;color:#fff;padding:14px}button{font-size:16px;padding:12px;margin:4px}video{display:block;width:100%;max-width:720px;background:#000;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#273b51;padding:12px}a{color:#9bd9ff}</style></head><body><h2>AirTaxi 動画テスト②</h2><p>同じ動画を3つの読み込み方法で比較します。</p><button onclick="test('normal')">① 通常のvideo</button><button onclick="test('anonymous')">② crossorigin=anonymous</button><button onclick="test('fetch')">③ fetchで取得確認</button><video id="v" controls playsinline webkit-playsinline></video><pre id="log">ボタンを押してください</pre><script>
const v=document.getElementById('v'),out=document.getElementById('log');const src=new URL('videos/flight_01.mp4',location.href).href;let mode='';function report(ev){let e=v.error;out.textContent=`方式: ${mode}\nイベント: ${ev}\nURL: ${src}\nvideo.currentSrc: ${v.currentSrc}\nreadyState: ${v.readyState}\nnetworkState: ${v.networkState}\npaused: ${v.paused}\ntime: ${v.currentTime}\nerror: ${e?e.code+' '+e.message:'なし'}\nサイズ: ${v.videoWidth}x${v.videoHeight}`}
async function test(m){mode=m;v.pause();v.removeAttribute('src');v.removeAttribute('crossorigin');v.load();if(m==='fetch'){try{let r=await fetch(src,{cache:'no-store'});out.textContent=`fetch HTTP ${r.status}\nContent-Type: ${r.headers.get('content-type')}\nContent-Length: ${r.headers.get('content-length')}\n最終URL: ${r.url}`;r.body?.cancel();}catch(e){out.textContent='fetch失敗: '+e.name+' '+e.message}return;}if(m==='anonymous')v.crossOrigin='anonymous';v.src=src;v.load();report('load開始');try{await v.play();report('play成功')}catch(e){report('play失敗: '+e.name+' '+e.message)}}for(const ev of ['loadedmetadata','canplay','playing','timeupdate','error','stalled','waiting'])v.addEventListener(ev,()=>report(ev));
</script></body></html>
