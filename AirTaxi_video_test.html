<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AirTaxi 動画読込テスト</title><style>body{font-family:system-ui;background:#142334;color:white;padding:16px}button{font-size:17px;padding:12px;margin:5px}video{width:100%;max-width:700px;background:black}pre{white-space:pre-wrap;word-break:break-all;background:#26394d;padding:12px}</style><h2>AirTaxi 動画読み込みテスト</h2><p>GitHub PagesにこのHTMLをAirTaxi_Offline.htmlと同じ場所に置いてください。</p><button id="relative">① 相対パス</button><button id="absolute">② 絶対パス</button><button id="reset">停止</button><p>動画が下に平面で表示されるか確認します。</p><video id="v" playsinline webkit-playsinline controls></video><pre id="log"></pre><script>const v=document.querySelector('#v'), log=document.querySelector('#log');let mode='未選択';function status(e){const x=v.error;log.textContent=`検査: ${mode}\nイベント: ${e||'-'}\nページURL: ${location.href}\n解決先: ${v.currentSrc||v.src}\nreadyState: ${v.readyState}\nnetworkState: ${v.networkState}\ncurrentTime: ${v.currentTime}\npaused: ${v.paused}\nerror: ${x?x.code+' '+x.message:'なし'}\nvideoWidth: ${v.videoWidth}\nvideoHeight: ${v.videoHeight}`;}async function run(which){v.pause();v.removeAttribute('src');v.load();mode=which;v.src=which==='相対パス'?'videos/flight_01.mp4':'https://283nakamura.github.io/videos/flight_01.mp4';v.load();status('設定');try{await v.play();status('play成功')}catch(e){status('play失敗 '+e.name+': '+e.message)}}document.querySelector('#relative').onclick=()=>run('相対パス');document.querySelector('#absolute').onclick=()=>run('絶対パス');document.querySelector('#reset').onclick=()=>{v.pause();v.removeAttribute('src');v.load();status('停止')};for(const e of ['loadedmetadata','canplay','playing','timeupdate','error','stalled','waiting'])v.addEventListener(e,()=>status(e));status('初期');</script></html>
